<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame Check</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="src/css/variables.css" />
    <link rel="stylesheet" href="src/css/style.css" />
  </head>

  <body>
    <div class="app">
      <!-- Sidebar with filters -->
      <aside class="sidebar" id="filters" aria-label="Filters"></aside>

      <div class="page">
        <!-- Header -->
        <header>
          <h1>FRAME CHECK</h1>
        </header>

        <main>
          <!-- Search bar-->
          <div class="search-row">
            <p class="search-row__count">
              Movie found <span class="search-row__number">24</span>
            </p>

            <div class="search-bar">
              <input
                type="search"
                id="search-input"
                class="search-bar__input"
                placeholder="Search for movies by title or keyword.."
              />
              <button id="search-button" class="search-bar__button">
                SEARCH
              </button>
            </div>
          </div>

          <!-- Active filters (placeholder) -->
          <div id="active-filters"></div>

          <!-- Film card (placeholder) -->
          <div id="movie-grid"></div>
        </main>
      </div>
    </div>
    
    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
