<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame Check</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="src/css/variables.css" />
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="src/css/filters.css" />
  </head>

  <body>
    <div class="app">
      <!-- Sidebar with filters -->
      <aside class="sidebar" id="filters" aria-label="Filters">
        <form class="filters" id="filters-form">
          <div class="filters_header">
            <h2 class="filters_title">
              <!-- Icon: Lucide (https://lucide.dev/icons/sliders-horizontal) -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-sliders-horizontal preview-icon"
              >
                <path d="M10 5H3" />
                <path d="M12 19H3" />
                <path d="M14 3v4" />
                <path d="M16 17v4" />
                <path d="M21 12h-9" />
                <path d="M21 19h-5" />
                <path d="M21 5h-7" />
                <path d="M8 10v4" />
                <path d="M8 12H3" />
              </svg>
              Filters
            </h2>

            <button type="reset" class="filters_reset-button">
              <!-- Icon: Lucide (https://lucide.dev/icons/rotate-ccw) -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-rotate-ccw preview-icon"
              >
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              Reset
            </button>
          </div>
          <hr class="divider" />

          <!-- Genre (will refactor when i know the actual genres) -->
          <fieldset class="genre-section">
            <div class="genre-section_header">
              <h3 class="genre-section_title">Genre</h3>
              <span class="genre-section_instruction">Select multiple</span>
            </div>

            <div class="genre-options">
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="drama"
                  id="genre-drama"
                />
                Drama
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="comedy"
                  id="genre-comedy"
                />
                Comedy
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="romance"
                  id="genre-romance"
                />
                Romance
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="sci-fi"
                  id="genre-sci-fi"
                />
                Sci-Fi
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="fantasy"
                  id="genre-fantasy"
                />
                Fantasy
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="adventure"
                  id="genre-adventure"
                />
                Adventure
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="horror"
                  id="genre-horror"
                />
                Horror
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="thriller"
                  id="genre-thriller"
                />
                Thriller
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="animation"
                  id="genre-animation"
                />
                Animation
              </label>
              <label class="genre-option">
                <input
                  type="checkbox"
                  name="genre"
                  value="documentary"
                  id="genre-documentary"
                />
                Documentary
              </label>
            </div>
          </fieldset>
          <hr class="divider" />

          <!-- Content warnings (will refactor when i know the actual content warnings) -->
          <fieldset class="content-warning-section">
            <h3 class="content-warning-section_title">Content warnings</h3>
            <p class="content-warning-section_instruction">
              Select what you want to avoid.<br />
              We'll hide the movies that contain it.
            </p>

            <div class="content-warning-options">
              <label class="content-warning-option">
                <input
                  type="checkbox"
                  name="content-warning"
                  value="violence"
                />
                Violence
              </label>
              <label class="content-warning-option">
                <input type="checkbox" name="content-warning" value="death" />
                Death
              </label>
              <label class="content-warning-option">
                <input
                  type="checkbox"
                  name="content-warning"
                  value="animal-cruelty"
                />
                Animal Cruelty
              </label>
              <label class="content-warning-option">
                <input
                  type="checkbox"
                  name="content-warning"
                  value="mental-health"
                />
                Mental Health
              </label>
              <label class="content-warning-option">
                <input
                  type="checkbox"
                  name="content-warning"
                  value="sexual-content"
                />
                Sexual Content
              </label>
              <label class="content-warning-option">
                <input
                  type="checkbox"
                  name="content-warning"
                  value="substance-abuse"
                />
                Substance Abuse
              </label>
            </div>
          </fieldset>
        </form>

        <!-- Content note -->
        <div class="content-note">
          <!-- Icon: Lucide (https://lucide.dev/icons/info) -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="content-note_icon lucide lucide-info preview-icon"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4" />
            <path d="M12 8h.01" />
          </svg>
          <p class="content-note_text" role="note">
            What feels sensitive varies from person to person. Check the movie's
            content details before watching.
          </p>
        </div>
      </aside>

      <div class="page">
        <!-- Header -->
        <header>
          <h1>FRAME CHECK</h1>
        </header>

        <main>
          <!-- Search bar-->
          <div class="search-row">
            <p class="search-row_count">
              Movie found <span class="search-row_number">24</span>
            </p>

            <div class="search-bar">
              <input
                type="search"
                id="search-input"
                class="search-bar_input"
                placeholder="Search for movies by title or keyword.."
              />
              <button id="search-button" class="search-bar_button">
                SEARCH
              </button>
            </div>
          </div>

          <!-- Active filters -->
          <!-- Icon: Lucide (https://lucide.dev/icons/x) -->
          <div class="active-filters">
            <label class="active-filter" for="genre-drama" data-genre="drama">
              Drama
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label class="active-filter" for="genre-comedy" data-genre="comedy">
              Comedy
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label
              class="active-filter"
              for="genre-romance"
              data-genre="romance"
            >
              Romance
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label class="active-filter" for="genre-sci-fi" data-genre="sci-fi">
              Sci-Fi
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label
              class="active-filter"
              for="genre-fantasy"
              data-genre="fantasy"
            >
              Fantasy
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label
              class="active-filter"
              for="genre-adventure"
              data-genre="adventure"
            >
              Adventure
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label class="active-filter" for="genre-horror" data-genre="horror">
              Horror
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label
              class="active-filter"
              for="genre-thriller"
              data-genre="thriller"
            >
              Thriller
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label
              class="active-filter"
              for="genre-animation"
              data-genre="animation"
            >
              Animation
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
            <label
              class="active-filter"
              for="genre-documentary"
              data-genre="documentary"
            >
              Documentary
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </label>
          </div>

          <!-- Film card (placeholder) -->
          <div id="movie-grid"></div>
        </main>
      </div>
    </div>
  </body>
</html>
